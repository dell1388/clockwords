<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Word War 3</title>
<meta name="description" content="Word War 3: type words to load your tank cannon and stop the armoured column stealing your intel.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Roboto+Condensed:wght@400;700&family=Special+Elite&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="wrap">
  <canvas id="stage" width="960" height="640" tabindex="0"></canvas>
  <button id="mute" type="button" title="Sound">🔊</button>
  <input id="kb" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" aria-label="type a word">

</div>
  <div id="toasts"></div>

  <div class="screen on" id="loading">
    <div class="plate">
      <div class="crest">★</div>
      <h2>WORD WAR 3</h2>
      <div id="loadwrap"><div id="loadbar"></div></div>
      <p id="loadtxt">Loading the field manual…</p>
    </div>
  </div>

  <div class="screen" id="title"></div>
  <div class="screen" id="howto"></div>
  <div class="screen" id="intro"></div>
  <div class="screen" id="boiler"></div>
  <div class="screen" id="gameover"></div>
  <div class="screen" id="pause"></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
