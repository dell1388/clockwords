<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clockwords</title>
<meta name="description" content="A faithful web remake of Clockwords: type words to fire letters at mechanical bugs stealing your formula.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&family=Special+Elite&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="wrap">
  <canvas id="stage" width="960" height="640" tabindex="0"></canvas>
  <button id="mute" title="Sound">⚙</button>
  <input id="kb" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" aria-label="type a word">
  <div id="toasts"></div>

  <div class="screen on" id="loading">
    <div class="plate">
      <div class="crest">⚙</div>
      <h2>CLOCKWORDS</h2>
      <div id="loadwrap"><div id="loadbar"></div></div>
      <p id="loadtxt">Opening the lexicon…</p>
    </div>
  </div>

  <div class="screen" id="title"></div>
  <div class="screen" id="levels"></div>
  <div class="screen" id="howto"></div>
  <div class="screen" id="intro"></div>
  <div class="screen" id="boiler"></div>
  <div class="screen" id="gameover"></div>
  <div class="screen" id="pause"></div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
